{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Cache Status</h1>
    
    <!-- Cache Generation Options -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Generate New Cache</h5>
        </div>
        <div class="card-body">
            <form id="cacheGenerationForm">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <h6>Node Cache Options</h6>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="generateNodeCache" name="generateNodeCache">
                            <label class="form-check-label" for="generateNodeCache">
                                Generate Node Cache
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="balanceNodes" name="balanceNodes">
                            <label class="form-check-label" for="balanceNodes">
                                Balance Nodes by Subgroup
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6>Graph Cache Options</h6>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="generateGraphCache" name="generateGraphCache">
                            <label class="form-check-label" for="generateGraphCache">
                                Generate Graph Cache
                            </label>
                        </div>
                        <div class="mb-2">
                            <label for="qualityThreshold" class="form-label">Quality Threshold</label>
                            <input type="number" class="form-control" id="qualityThreshold" name="qualityThreshold" value="0.5" step="0.1" min="0" max="1">
                        </div>
                        <div class="mb-2">
                            <label for="symmetryThreshold" class="form-label">Symmetry Threshold</label>
                            <input type="number" class="form-control" id="symmetryThreshold" name="symmetryThreshold" value="0.5" step="0.1" min="0" max="1">
                        </div>
                        <div class="mb-2">
                            <label for="embeddingThreshold" class="form-label">Embedding Threshold</label>
                            <input type="number" class="form-control" id="embeddingThreshold" name="embeddingThreshold" value="0.5" step="0.1" min="0" max="1">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="generateCacheBtn">
                    <i class="fas fa-sync-alt me-2"></i>Generate Cache
                </button>
            </form>
        </div>
    </div>

    <!-- Cache Status Display -->
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Node Cache</h5>
                    <button class="btn btn-sm btn-outline-primary" onclick="refreshCacheStatus()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="card-body">
                    <div id="nodeCacheStatus">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Graph Cache</h5>
                    <button class="btn btn-sm btn-outline-primary" onclick="refreshCacheStatus()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="card-body">
                    <div id="graphCacheStatus">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Immediate console log to verify script loading
console.log('Cache status script loaded');

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function formatDate(timestamp) {
    return new Date(timestamp * 1000).toLocaleString();
}

function generateNodeCacheHtml(data) {
    console.log('Generating node cache HTML with data:', data);
    console.log('Node cache data structure:', JSON.stringify(data, null, 2));
    
    if (!data || Object.keys(data).length === 0) {
        return '<div class="alert alert-warning">No node cache data available</div>';
    }

    let html = '<table class="table table-sm">';
    html += '<thead><tr><th>Split</th><th>Status</th><th>Node Count</th><th>Balanced Count</th><th>Last Modified</th><th>Size</th></tr></thead><tbody>';
    
    // Check if the cache file exists
    if (data.exists) {
        for (const split of ['train', 'val', 'test']) {
            console.log(`Processing split ${split}:`, data[split]);
            const splitData = data[split];
            if (splitData) {
                html += `<tr>
                    <td>${split}</td>
                    <td><span class="badge bg-success">Available</span></td>
                    <td>${splitData.node_count || 'N/A'}</td>
                    <td>${splitData.balanced_count || 'N/A'}</td>
                    <td>${formatDate(data.last_modified)}</td>
                    <td>${formatFileSize(data.size)}</td>
                </tr>`;
            } else {
                html += `<tr>
                    <td>${split}</td>
                    <td><span class="badge bg-warning">No Data</span></td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>`;
            }
        }
    } else {
        // If cache doesn't exist, show missing for all splits
        for (const split of ['train', 'val', 'test']) {
            html += `<tr>
                <td>${split}</td>
                <td><span class="badge bg-danger">Missing</span></td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>`;
        }
    }
    
    html += '</tbody></table>';
    
    // Add file info if available
    if (data.file_path) {
        html += `<div class="mt-3">
            <small class="text-muted">
                <i class="fas fa-info-circle"></i> File: ${data.file_path}
                ${data.load_error ? `<br><i class="fas fa-exclamation-triangle text-warning"></i> ${data.load_error}` : ''}
            </small>
        </div>`;
    }
    
    return html;
}

function generateGraphCacheHtml(data) {
    console.log('Generating graph cache HTML with data:', data);
    console.log('Graph cache data structure:', JSON.stringify(data, null, 2));
    
    if (!data || Object.keys(data).length === 0) {
        return '<div class="alert alert-warning">No graph cache data available</div>';
    }

    let html = '<table class="table table-sm">';
    html += '<thead><tr><th>Split</th><th>Status</th><th>Edge Count</th><th>Last Modified</th><th>Size</th></tr></thead><tbody>';
    
    for (const split of ['train', 'val', 'test']) {
        console.log(`Processing split ${split}:`, data[split]);
        const splitData = data[split];
        if (splitData && splitData.exists) {
            html += `<tr>
                <td>${split}</td>
                <td><span class="badge bg-success">Available</span></td>
                <td>${splitData.edge_count || 'N/A'}</td>
                <td>${formatDate(splitData.last_modified)}</td>
                <td>${formatFileSize(splitData.size)}</td>
            </tr>`;
        } else {
            html += `<tr>
                <td>${split}</td>
                <td><span class="badge bg-danger">Missing</span></td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>`;
        }
    }
    
    html += '</tbody></table>';
    
    // Add file info if available
    for (const split of ['train', 'val', 'test']) {
        const splitData = data[split];
        if (splitData && splitData.file_path) {
            html += `<div class="mt-3">
                <small class="text-muted">
                    <i class="fas fa-info-circle"></i> ${split} file: ${splitData.file_path}
                    ${splitData.load_error ? `<br><i class="fas fa-exclamation-triangle text-warning"></i> ${splitData.load_error}` : ''}
                </small>
            </div>`;
        }
    }
    
    return html;
}

function showLoadingProgress(elementId, message) {
    const element = document.getElementById(elementId);
    element.innerHTML = `
        <div class="text-center">
            <div class="progress mb-3" style="height: 20px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                     role="progressbar" 
                     style="width: 100%" 
                     aria-valuenow="100" 
                     aria-valuemin="0" 
                     aria-valuemax="100">
                </div>
            </div>
            <div class="text-muted">
                <i class="fas fa-spinner fa-spin me-2"></i>${message}
            </div>
        </div>
    `;
}

function refreshCacheStatus() {
    console.log('Starting cache status refresh...');
    
    // Show loading progress
    showLoadingProgress('nodeCacheStatus', 'Loading node cache information...');
    showLoadingProgress('graphCacheStatus', 'Loading graph cache information...');

    console.log('Making request to /api/cache/status...');
    // Fetch cache status
    fetch('/api/cache/status')
        .then(response => {
            console.log('Received response:', response.status, response.statusText);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('Received data:', data);
            console.log('Full response data structure:', JSON.stringify(data, null, 2));
            
            if (!data || typeof data !== 'object') {
                throw new Error('Invalid response format');
            }
            
            // Update node cache status
            const nodeCacheHtml = generateNodeCacheHtml(data.node_cache);
            document.getElementById('nodeCacheStatus').innerHTML = nodeCacheHtml || 
                '<div class="alert alert-warning">No node cache data available</div>';
            
            // Update graph cache status
            const graphCacheHtml = generateGraphCacheHtml(data.graph_cache);
            document.getElementById('graphCacheStatus').innerHTML = graphCacheHtml || 
                '<div class="alert alert-warning">No graph cache data available</div>';
        })
        .catch(error => {
            console.error('Error fetching cache status:', error);
            const errorHtml = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Error loading cache status: ${error.message}
                </div>
            `;
            document.getElementById('nodeCacheStatus').innerHTML = errorHtml;
            document.getElementById('graphCacheStatus').innerHTML = errorHtml;
        });
}

// Handle cache generation form submission
document.getElementById('cacheGenerationForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const generateBtn = document.getElementById('generateCacheBtn');
    generateBtn.disabled = true;
    generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Generating...';
    
    const formData = {
        generateNodeCache: document.getElementById('generateNodeCache').checked,
        balanceNodes: document.getElementById('balanceNodes').checked,
        generateGraphCache: document.getElementById('generateGraphCache').checked,
        qualityThreshold: parseFloat(document.getElementById('qualityThreshold').value),
        symmetryThreshold: parseFloat(document.getElementById('symmetryThreshold').value),
        embeddingThreshold: parseFloat(document.getElementById('embeddingThreshold').value)
    };
    
    fetch('/api/cache/generate', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Cache generation started successfully!');
            refreshCacheStatus();
        } else {
            alert('Error generating cache: ' + data.error);
        }
    })
    .catch(error => {
        alert('Error generating cache: ' + error.message);
    })
    .finally(() => {
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<i class="fas fa-sync-alt me-2"></i>Generate Cache';
    });
});

// Add event listener for page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('Page loaded, initializing cache status...');
    refreshCacheStatus();
});
</script>
{% endblock %}
