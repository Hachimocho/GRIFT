name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: ci
          cache-downloads: true
          cache-environment: true
          init-shell: bash

      - name: Install test dependencies
        shell: bash -l {0}
        run: micromamba install -y -n ci pytest pytest-cov

      - name: Run tests
        shell: bash -l {0}
        run: micromamba run -n ci pytest

