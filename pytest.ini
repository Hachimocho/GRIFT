[pytest]
minversion = 8.0
testpaths = tests
addopts = -q --strict-markers --strict-config --durations=10
python_files = test_*.py
python_classes = Test*
python_functions = test_*
xfail_strict = true
timeout = 300

# Tier markers. Tiers are opted into with --run-gpu / --run-slow / --run-data /
# --run-network (or --run-all), NOT with `-m`. Using `-m` in addopts would be a
# footgun: a user's own `-m gpu` silently *replaces* an addopts filter rather
# than adding to it, so the fast tier's exclusions would vanish without warning.
markers =
    gpu: requires CUDA. Real backbones, AMP, device placement, bit-exactness under strict mode.
    slow: short multi-epoch train/traverse runs. Minutes, not seconds.
    data: requires the real AI-Face dataset on disk.
    network: requires torch.hub / URL downloads. Never runs in CI.
    determinism: bit-exactness and seed-reproducibility assertions.
    bench: uncertainty-benchmark tests (registered here so the benchmark work needs no pytest config changes).

filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::DeprecationWarning:torchvision.*
    ignore::UserWarning:torch.*
